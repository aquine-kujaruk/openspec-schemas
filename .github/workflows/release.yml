name: release

# Publishes every package under packages-v<version> when a tag v<version> is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag is the version of package.json
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - run: pnpm exec factory generate
      - run: pnpm run check
      - name: Release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm exec factory release --push origin
